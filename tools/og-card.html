<!doctype html>
<meta charset="utf-8">
<!--
  Source for /public/og-card.png — the 1200x630 image every link preview
  (Facebook, LinkedIn, X, Slack, Discord, WhatsApp) renders. It is a build
  input, not a page the site serves; nothing links to it.

  Regenerate after editing, with node_modules installed so the brand faces
  resolve, then commit the PNG. Both paths must be absolute — headless Chrome
  reads a bare relative argument as a hostname, not a file:

    chrome --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot=<repo>/public/og-card.png file:///<repo>/tools/og-card.html

  Colours and faces are copied from src/index.css; keep them in step.
-->
<style>
  @font-face {
    font-family: "Archivo Variable";
    src: url("../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2") format("woff2");
    font-weight: 100 900;
    font-stretch: 62% 125%;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
    font-weight: 500;
  }

  :root {
    --ink: #0a0a0b;
    --ink-raised: #141417;
    --ink-line: #26262c;
    --gold: #d4af37;
    --gold-lit: #f0c75e;
    --gold-deep: #8a6f1e;
    --bone: #f6f4ef;
    --slate: #6f6f78;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; }

  body {
    background: var(--ink);
    color: var(--bone);
    font-family: "IBM Plex Mono", monospace;
    overflow: hidden;
    position: relative;
  }

  /* Hairline grid — the yard floor, barely there. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(212,175,55,0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(212,175,55,0.055) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Struck light from the upper right. */
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 88% 8%, rgba(212,175,55,0.16), transparent 58%);
  }

  .frame {
    position: absolute;
    inset: 32px;
    border: 1px solid rgba(212,175,55,0.22);
  }

  .plate {
    position: absolute;
    inset: 32px;
    padding: 62px 68px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ── Top rail ───────────────────────────────────────── */
  .rail {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 500;
  }
  .rail .right { color: var(--slate); letter-spacing: 0.28em; }

  /* ── Wordmark ───────────────────────────────────────── */
  .mark { display: flex; align-items: flex-start; gap: 30px; }

  .monogram {
    width: 104px; height: 104px;
    flex: none;
    display: grid; place-items: center;
    border: 1px solid rgba(212,175,55,0.55);
    background: linear-gradient(160deg, rgba(212,175,55,0.13), rgba(212,175,55,0.02));
    font-family: "Archivo Variable", sans-serif;
    font-stretch: 125%;
    font-variation-settings: "wdth" 125;
    font-weight: 700;
    font-size: 38px;
    letter-spacing: 0.02em;
    color: var(--gold);
  }

  .name {
    font-family: "Archivo Variable", sans-serif;
    font-stretch: 125%;
    font-variation-settings: "wdth" 125;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 78px;
    line-height: 0.94;
    letter-spacing: 0.005em;
    color: var(--bone);
  }

  .sub {
    margin-top: 18px;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
  }

  /* ── Commodity line ─────────────────────────────────── */
  .book {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 17px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #a8a4a0;
  }
  .book .dot { color: var(--gold-deep); }

  /* ── Bottom rule + footer ───────────────────────────── */
  .rule {
    height: 1px;
    background: linear-gradient(to right, var(--gold) 0%, rgba(212,175,55,0.28) 42%, transparent 100%);
    margin-bottom: 22px;
  }
  .foot {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 15px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--slate);
  }
  /* Deliberately a phone number, not a URL: the card is the same artwork
     whatever host it is served from, and the company has no live domain of
     its own yet. Number tracks CONTACT.tel in src/data/company.ts. */
  .foot .site { color: var(--bone); letter-spacing: 0.14em; }
</style>

<div class="grid"></div>
<div class="glow"></div>
<div class="frame"></div>

<div class="plate">
  <div class="rail">
    <span>Mainz &middot; Germany</span>
    <span class="right">Import &nbsp;/&nbsp; Export</span>
  </div>

  <div>
    <div class="mark">
      <div class="monogram">AS</div>
      <div>
        <div class="name">A.S. Uppal<br>Trading GmbH</div>
        <div class="sub">Bulk Commodity Trading</div>
      </div>
    </div>

    <div class="book" style="margin-top:44px">
      <span>Scrap Metal</span><span class="dot">/</span>
      <span>Used Cars</span><span class="dot">/</span>
      <span>Laptops</span><span class="dot">/</span>
      <span>Nuts</span><span class="dot">/</span>
      <span>Cooking Oil</span>
    </div>
  </div>

  <div>
    <div class="rule"></div>
    <div class="foot">
      <span class="site">+49 162 9775400</span>
      <span>Sorted &middot; Graded &middot; Shipped</span>
    </div>
  </div>
</div>
