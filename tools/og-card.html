<!doctype html>
<meta charset="utf-8">
<!--
  Template for the 1200×630 link-preview cards under /public/og — the image
  Facebook, LinkedIn, X, Slack, Discord and WhatsApp render when a page is
  shared. A build input, not a page the site serves; nothing links to it.

  The copy comes from the query string, so one template produces every card:

    ?kicker=Scrap&headline=Copper%20Scrap&sub=Price%20Varying&line=8%20listings

  Opening it with no query shows the homepage card. Run `npm run cards` to
  regenerate all of them (tools/build-cards.mjs drives headless Chrome over
  every route in src/data/seo.ts) and commit the PNGs — the deploy builder
  has no browser, so these cannot be generated on Vercel.

  Colours and faces are copied from src/index.css; keep them in step.
-->
<style>
  @font-face {
    font-family: "Archivo Variable";
    src: url("../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2") format("woff2");
    font-weight: 100 900;
    font-stretch: 62% 125%;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
    font-weight: 500;
  }

  :root {
    --ink: #0a0a0b;
    --gold: #d4af37;
    --gold-deep: #8a6f1e;
    --bone: #f6f4ef;
    --slate: #6f6f78;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; }

  body {
    background: var(--ink);
    color: var(--bone);
    font-family: "IBM Plex Mono", monospace;
    overflow: hidden;
    position: relative;
  }

  /* Hairline grid — the yard floor, barely there. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(212,175,55,0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(212,175,55,0.055) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Light falling from above. Vertical on purpose: each row of the image is
     then one flat colour, which PNG compresses hard. The radial glow this
     replaces looked slightly better and cost 4.3 MB across 24 cards against
     1.8 MB for this — the cards are thumbnails in a chat window, and the
     difference is invisible at the size anyone actually sees them. */
  .glow {
    position: absolute; inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(212,175,55,0.11) 0%,
      rgba(212,175,55,0.03) 46%,
      transparent 82%
    );
  }

  .frame { position: absolute; inset: 32px; border: 1px solid rgba(212,175,55,0.22); }

  .plate {
    position: absolute;
    inset: 32px;
    padding: 62px 68px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ── Top rail ───────────────────────────────────────── */
  .rail {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .rail .right { color: var(--slate); letter-spacing: 0.28em; }

  /* ── Wordmark ───────────────────────────────────────── */
  .mark { display: flex; align-items: flex-start; gap: 30px; }

  .monogram {
    width: 104px; height: 104px;
    flex: none;
    display: grid; place-items: center;
    border: 1px solid rgba(212,175,55,0.55);
    background: linear-gradient(160deg, rgba(212,175,55,0.13), rgba(212,175,55,0.02));
    font-family: "Archivo Variable", sans-serif;
    font-stretch: 125%;
    font-variation-settings: "wdth" 125;
    font-weight: 700;
    font-size: 38px;
    letter-spacing: 0.02em;
    color: var(--gold);
  }

  /* Headline sizing is set by the fit() pass below, not here — the copy runs
     from "Oil" to a full sentence and no single size serves both. */
  .headline {
    font-family: "Archivo Variable", sans-serif;
    font-stretch: 125%;
    font-variation-settings: "wdth" 125;
    font-weight: 700;
    text-transform: uppercase;
    line-height: 0.94;
    letter-spacing: 0.005em;
    color: var(--bone);
  }

  .sub {
    margin-top: 18px;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .line {
    margin-top: 44px;
    font-size: 17px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #a8a4a0;
  }
  .line .sep { color: var(--gold-deep); }

  /* ── Bottom rule + footer ───────────────────────────── */
  .rule {
    height: 1px;
    background: linear-gradient(to right, var(--gold) 0%, rgba(212,175,55,0.28) 42%, transparent 100%);
    margin-bottom: 22px;
  }
  .foot {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 15px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--slate);
  }
  /* Deliberately a phone number and not a URL: the artwork is the same
     whatever host serves it, and the company has no domain of its own yet.
     Tracks CONTACT.tel in src/data/company.ts. */
  .foot .tel { color: var(--bone); letter-spacing: 0.14em; }
</style>

<div class="grid"></div>
<div class="glow"></div>
<div class="frame"></div>

<div class="plate">
  <div class="rail">
    <span id="kicker"></span>
    <span class="right">Import &nbsp;/&nbsp; Export</span>
  </div>

  <div>
    <div class="mark">
      <div class="monogram">AS</div>
      <div id="column">
        <div class="headline" id="headline"></div>
        <div class="sub" id="sub"></div>
      </div>
    </div>
    <div class="line" id="line"></div>
  </div>

  <div>
    <div class="rule"></div>
    <div class="foot">
      <span class="tel">+49 162 9775400</span>
      <span>Sorted &middot; Graded &middot; Shipped</span>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const copy = {
    kicker: params.get("kicker") || "Mainz · Germany",
    headline: params.get("headline") || "A.S. Uppal Trading GmbH",
    sub: params.get("sub") || "Bulk Commodity Trading",
    line: params.get("line") || "Scrap Metal / Used Cars / Laptops / Nuts / Cooking Oil",
  };

  document.getElementById("kicker").textContent = copy.kicker;
  document.getElementById("headline").textContent = copy.headline;
  document.getElementById("sub").textContent = copy.sub;

  // Tint the separators in the bottom list without letting copy inject markup.
  const line = document.getElementById("line");
  copy.line.split("/").forEach((part, i) => {
    if (i > 0) {
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = " / ";
      line.append(sep);
    }
    line.append(document.createTextNode(part.trim()));
  });

  /**
   * Shrink the headline until it fits the space above the sub-line. Copy runs
   * from "Oil" to a full sentence, so the largest size that still fits beats
   * a fixed size per route that would need hand tuning on every rename.
   *
   * This MUST wait for document.fonts.ready. Measuring against the fallback
   * face reports a shorter headline than Archivo Expanded actually sets, and
   * the fitter then leaves it too large — it overflows the plate and lands on
   * top of the footer rule, which is exactly what the first run of these
   * cards did.
   */
  function fit() {
    const el = document.getElementById("headline");
    const MAX_HEIGHT = 268;
    for (let size = 78; size >= 30; size -= 2) {
      el.style.fontSize = size + "px";
      if (el.scrollHeight <= MAX_HEIGHT) return;
    }
  }

  document.fonts.ready.then(fit);
</script>
