<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <link rel="icon" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/logo512.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Search and link previews ────────────────────────────────────────
         Everything between the markers below is REGENERATED PER ROUTE at
         build time by tools/prerender.mjs, from the table in src/data/seo.ts.
         Each route gets its own dist/<route>/index.html with its own title,
         description, canonical and card; this file's copy of the block is the
         homepage's, and is what `npm run dev` serves on every path.

         Edit the copy in src/data/seo.ts, not here — a build overwrites this
         block in dist/index.html from that table. The markers themselves are
         load-bearing: the build fails if they go missing.

         Cards are 1200×630 PNGs under /og, generated by `npm run cards` and
         committed. They are not built on deploy (Vercel's builder has no
         browser), so regenerate and commit after changing card copy. -->
    <!-- seo:start -->
    <title>A.S. Uppal Trading GmbH | Scrap Metal, Cars, Laptops &amp; Nuts</title>
    <meta
      name="description"
      content="A.S. Uppal Trading GmbH trades scrap metal, used cars, laptops, nuts and cooking oil in bulk from Mainz, Germany — sorted, graded and shipped worldwide."
    />
    <link rel="canonical" href="https://asuppaltrading-website.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A.S. Uppal Trading GmbH" />
    <meta property="og:title" content="A.S. Uppal Trading GmbH — Bulk Commodity Trading, Mainz" />
    <meta
      property="og:description"
      content="A.S. Uppal Trading GmbH trades scrap metal, used cars, laptops, nuts and cooking oil in bulk from Mainz, Germany — sorted, graded and shipped worldwide."
    />
    <meta property="og:url" content="https://asuppaltrading-website.vercel.app/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://asuppaltrading-website.vercel.app/og/home.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A.S. Uppal Trading GmbH — scrap metal, used cars, laptops, nuts and cooking oil traded in bulk. A.S. Uppal Trading GmbH, Mainz, Germany."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A.S. Uppal Trading GmbH — Bulk Commodity Trading, Mainz" />
    <meta
      name="twitter:description"
      content="A.S. Uppal Trading GmbH trades scrap metal, used cars, laptops, nuts and cooking oil in bulk from Mainz, Germany — sorted, graded and shipped worldwide."
    />
    <meta name="twitter:image" content="https://asuppaltrading-website.vercel.app/og/home.png" />
    <meta
      name="twitter:image:alt"
      content="A.S. Uppal Trading GmbH — scrap metal, used cars, laptops, nuts and cooking oil traded in bulk. A.S. Uppal Trading GmbH, Mainz, Germany."
    />
    <!-- seo:end -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
