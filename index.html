<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <link rel="icon" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/logo512.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Search ──────────────────────────────────────────────────────────
         Title runs 59 characters so it fills the SERP line without being
         truncated; the description is the same text used for the social
         cards below, so a result and a shared link never disagree. -->
    <title>A.S. Uppal Trading GmbH | Scrap Metal, Cars, Laptops &amp; Nuts</title>
    <meta
      name="description"
      content="A.S. Uppal Trading GmbH trades scrap metal, used cars, laptops, nuts and cooking oil in bulk from Mainz, Germany — sorted, graded and shipped worldwide."
    />
    <link rel="canonical" href="https://asuppaltrading-website.vercel.app/" />

    <!-- ── Link previews ───────────────────────────────────────────────────
         Every absolute URL below points at the host the site is actually
         served from. That is the Vercel domain today — crawlers fetch
         og:image over the network, so a URL on a host that does not resolve
         yields a blank card. Swap all four when a custom domain goes live
         (canonical, og:url, og:image, twitter:image). The app is
         a single-page build served behind a catch-all rewrite, so crawlers
         (which do not run JavaScript) see this one document for every route —
         these tags describe the site as a whole, not the page that was
         shared. Per-route cards would need prerendering.

         og:image is /public/og-card.png at the 1200×630 Facebook, LinkedIn
         and X large-card size. It is regenerated from tools/og-card.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A.S. Uppal Trading GmbH" />
    <meta property="og:title" content="A.S. Uppal Trading GmbH — Bulk Commodity Trading, Mainz" />
    <meta
      property="og:description"
      content="A.S. Uppal Trading GmbH trades scrap metal, used cars, laptops, nuts and cooking oil in bulk from Mainz, Germany — sorted, graded and shipped worldwide."
    />
    <meta property="og:url" content="https://asuppaltrading-website.vercel.app/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://asuppaltrading-website.vercel.app/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A.S. Uppal Trading GmbH — scrap metal, used cars, laptops, nuts and cooking oil, traded from Mainz, Germany."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A.S. Uppal Trading GmbH — Bulk Commodity Trading, Mainz" />
    <meta
      name="twitter:description"
      content="A.S. Uppal Trading GmbH trades scrap metal, used cars, laptops, nuts and cooking oil in bulk from Mainz, Germany — sorted, graded and shipped worldwide."
    />
    <meta name="twitter:image" content="https://asuppaltrading-website.vercel.app/og-card.png" />
    <meta
      name="twitter:image:alt"
      content="A.S. Uppal Trading GmbH — scrap metal, used cars, laptops, nuts and cooking oil, traded from Mainz, Germany."
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
